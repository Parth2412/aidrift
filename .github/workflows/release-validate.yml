name: Release Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-validate:
    name: Release Validate
    if: github.head_ref == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate
        run: |
          pnpm format:check
          pnpm audit:dependencies
          pnpm audit:licenses
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm --filter @zettacore/aidrift-core test:eval-coverage
          pnpm --filter @zettacore/aidrift test:check-coverage
          pnpm build
          pnpm docs:check
          pnpm test:built-cli
          pnpm test:built-action
          pnpm release:check
          pnpm test:packed
          pnpm release:sbom
          git diff --exit-code -- packages/action/dist
          test -z "$(git ls-files --others --exclude-standard packages/action/dist)"
