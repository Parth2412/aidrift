name: CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Reject known critical or high vulnerabilities
        run: pnpm audit:dependencies

      - name: Verify production licenses
        run: pnpm audit:licenses

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Enforce package-wide coverage
        run: pnpm test:coverage

      - name: Enforce eval coverage
        run: pnpm --filter @zettacore/aidrift-core test:eval-coverage

      - name: Enforce check coverage
        run: pnpm --filter @zettacore/aidrift test:check-coverage

      - name: Build
        run: pnpm build

      - name: Verify generated references
        run: pnpm docs:check

      - name: Test built CLI
        run: pnpm test:built-cli

      - name: Test built Action
        run: pnpm test:built-action

      - name: Verify release package contents
        run: pnpm release:check

      - name: Test installed package tarballs
        run: pnpm test:packed

      - name: Generate and verify release SBOM
        run: pnpm release:sbom

      - name: Verify checked-in Action bundle
        run: |
          git diff --exit-code -- packages/action/dist
          test -z "$(git ls-files --others --exclude-standard packages/action/dist)"
